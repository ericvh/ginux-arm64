name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-and-unit:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - run: brew install ripgrep
      - run: rustup component add clippy rustfmt
      - run: rustup target add x86_64-unknown-linux-gnu
      - run: make check
      - run: make test-unit

  launch-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: rustup target add x86_64-unknown-linux-gnu
      - run: make build build-launch-fixture build-process-fixtures build-gate1-fixture
      - run: sudo make test-launch
      - run: sudo make test-native-supervision
      - run: make test-process-native
      - run: sudo make test-gate1-setup

  aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y qemu-user-static qemu-system-arm cpio
      - run: rustup target add aarch64-unknown-linux-gnu aarch64-unknown-none
      - run: make build-arm64
      - run: make arch-smoke-arm64
      - run: make legacy-kernel-aarch64
      - name: Fetch the published v9fs arm64 kernel
        run: curl -fsSL -o "$RUNNER_TEMP/Image" https://github.com/v9fs/test/releases/download/kernel-v7.4-rc1/Image
      - run: GINUX_AARCH64_KERNEL="$RUNNER_TEMP/Image" make gate1-aarch64-guest
      - run: GINUX_AARCH64_KERNEL="$RUNNER_TEMP/Image" make native-aarch64-guest
