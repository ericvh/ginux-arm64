name: check

on:
  pull_request:
  push:
    # arm64/main is this fork's integration branch; main mirrors upstream.
    branches: [main, arm64/main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
      - run: make test-ci-changes
      - name: Compare with the newest commit that passed
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TARGET_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow check.yml \
            --status success --limit 300 --json headSha --jq '.[].headSha' \
            >"$RUNNER_TEMP/passed" || : >"$RUNNER_TEMP/passed"
          status=0
          ./scripts/ci-changes.sh "$HEAD_SHA" "$RUNNER_TEMP/passed" ${TARGET_SHA:+"$TARGET_SHA"} \
            >>"$GITHUB_OUTPUT" 2>"$RUNNER_TEMP/reason" || status=$?
          cat "$RUNNER_TEMP/reason"
          { echo '```'; cat "$RUNNER_TEMP/reason"; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Name checks for documentation-only changes
        if: steps.classify.outputs.code == 'false'
        run: |
          command -v rg >/dev/null || { sudo apt-get update && sudo apt-get install -y ripgrep; }
          make check-name check-instance-terminology

  static-and-unit:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - run: brew install ripgrep
      - run: rustup component add clippy rustfmt
      - run: rustup target add x86_64-unknown-linux-gnu x86_64-unknown-linux-musl
      - run: make check
      - run: make test-unit
      - run: make test-release-overflow

  launch-integration:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: rustup target add x86_64-unknown-linux-gnu x86_64-unknown-linux-musl
      - name: Host Cargo metadata is free of freestanding linker flags
        run: >-
          cargo check --workspace --all-targets
          --exclude ginux-init
          --exclude managed-payload
          --exclude baseline-runner
          --exclude runtime-fixture
          --exclude process-native-fixture
      - run: make build build-launch-fixture build-process-fixtures build-gate1-fixture
      - run: sudo make test-launch
      - run: sudo make test-native-supervision
      - run: make test-process-native
      - run: sudo make test-gate1-setup
      - run: sudo make test-tracee-kill

  # aarch64 port (this fork). The daemon is built and checked for aarch64,
  # then run under a real arm64 kernel in a guest, because the supervision
  # paths need ptrace and seccomp on that architecture.
  aarch64:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04-arm
    env:
      # The toolchain this tree is checked with. The runner's default is
      # newer, and its clippy rejects a loop in upstream's ginux-runtime
      # that the x86_64 check job's toolchain accepts.
      RUSTUP_TOOLCHAIN: "1.99.1"
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-arm cpio
      - run: >-
          rustup toolchain install 1.99.1 --profile minimal --component clippy
          --target aarch64-unknown-linux-gnu --target aarch64-unknown-none
      - run: make build-arm64
      - run: make check-arm64
      # The runner is arm64, so the smoke test needs no emulator.
      - run: make arch-smoke-arm64 QEMU_AARCH64=
      - run: make legacy-kernel-aarch64
      - name: Fetch the published v9fs arm64 kernel
        run: curl -fsSL -o "$RUNNER_TEMP/Image" https://github.com/v9fs/test/releases/download/kernel-v7.4-rc1/Image
      - run: GINUX_AARCH64_KERNEL="$RUNNER_TEMP/Image" make gate1-aarch64-guest
      - run: GINUX_AARCH64_KERNEL="$RUNNER_TEMP/Image" make native-aarch64-guest
      # Upstream's integration test scripts, directly on the arm64 runner:
      # launch, native supervision, gate 1 setup, tracee kill, process native.
      # test-process-native runs unprivileged, as it does in the x86_64 job.
      - run: make build-fixtures-arm64
      - run: sudo make test-launch-arm64
      - run: sudo make test-native-supervision-arm64
      - run: sudo make test-page-size-arm64
      # The runner has 4K pages, where that test passes whatever the
      # supervisor assumes. Run it again in a guest on Ubuntu's 64K-page
      # kernel, with a Python root filesystem for the test script.
      - name: Fetch a 64K-page arm64 kernel and a root filesystem with Python
        working-directory: ${{ runner.temp }}
        run: |
          apt-get download linux-image-unsigned-6.8.0-31-generic-64k
          echo "a706d1a8cfb2928c24563923f352bfb17fbef9f1ee2f0da7a5e916fa30cfedfd  linux-image-unsigned-6.8.0-31-generic-64k_6.8.0-31.31_arm64.deb" | sha256sum -c
          dpkg-deb -x linux-image-unsigned-6.8.0-31-generic-64k_6.8.0-31.31_arm64.deb kernel-64k
          docker pull -q python:3.13-alpine
          docker export "$(docker create python:3.13-alpine)" -o arm64-rootfs.tar
      - run: >-
          GINUX_AARCH64_KERNEL="$RUNNER_TEMP/kernel-64k/boot/vmlinuz-6.8.0-31-generic-64k"
          GINUX_AARCH64_ROOTFS="$RUNNER_TEMP/arm64-rootfs.tar"
          make page-size-aarch64-guest
      # Two of upstream's scripts on that kernel as well. The third that a
      # minimal guest can run, test-native-supervision, is left out for two
      # reasons that hold on x86_64 too: one of its checks needs a kernel
      # newer than 6.8, and another fails whenever a child's virtual pid
      # equals a managed task's host pid, which a freshly booted guest's
      # small pids make likely. See docs/arm64/README.md.
      - run: >-
          GINUX_AARCH64_SHARE=initrd
          GINUX_AARCH64_KERNEL="$RUNNER_TEMP/kernel-64k/boot/vmlinuz-6.8.0-31-generic-64k"
          GINUX_AARCH64_ROOTFS="$RUNNER_TEMP/arm64-rootfs.tar"
          make integration-aarch64-guest TESTS="gate1-setup process-native"
      - run: make test-process-native-arm64
      - run: sudo make test-gate1-setup-arm64
      - run: sudo make test-tracee-kill-arm64
      # The host-side crates on an arm64 host: every unit test, then the
      # allocator's conformance and benchmark programs with the library
      # preloaded.
      - run: make test-unit
      - run: make test-allocator
      - run: make test-allocator-linux
