[workspace]
members = [
    "boot/efi",
    "kernel",
    "crates/image-store",
    "crates/kernel-policy",
    "crates/native-abi",
    "crates/oci",
    "crates/oci-cache",
    "crates/volume-format",
    "crates/volume-service",
    "crates/baseline-runner",
    "crates/ginux-core",
    "crates/ginux-domain",
    "crates/ginux-devices",
    "crates/ginux-init",
    "crates/ginux-kernel-views",
    "crates/ginux-process",
    "crates/ginux-runtime",
    "crates/ginux-vfs",
    "crates/ginux-vfs-index",
    "crates/managed-payload",
    "crates/process-native-fixture",
    "crates/runtime-fixture",
]
resolver = "2"

[workspace.package]
license = "Apache-2.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
