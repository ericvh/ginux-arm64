# The bare-metal kernel line: the UEFI boot entry, the kernel, and the crates
# only they use. This is its own workspace so the userspace daemon workspace
# at the repository root keeps its manifest, lockfile, and checks unchanged.
# The directory mirrors the layout of the `bootable-kernel` branch root.
[workspace]
members = [
    "boot/efi",
    "kernel",
    "crates/image-store",
    "crates/kernel-policy",
    "crates/native-abi",
    "crates/oci",
    "crates/oci-cache",
    "crates/volume-format",
    "crates/volume-service",
]
exclude = ["legacy-kernel"]
resolver = "2"

[workspace.package]
license = "Apache-2.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
overflow-checks = true
panic = "abort"
strip = true
